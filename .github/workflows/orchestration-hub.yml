name: Network Orchestration Hub

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/orchestration-hub.yml"
      - "services/network-orchestration-hub/**"
  pull_request:
    paths:
      - ".github/workflows/orchestration-hub.yml"
      - "services/network-orchestration-hub/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attestation:
    name: Python attestation verifier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/network-orchestration-hub/attestation
    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python modules
        run: python -m py_compile attestation_core.py attestation_service.py evm_abi.py

      - name: Run core tests
        run: python -m unittest discover -s tests

  scheduler:
    name: Go job scheduler
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/network-orchestration-hub/scheduler
    steps:
      - uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/network-orchestration-hub/scheduler/go.mod

      - name: Run scheduler tests
        run: go test ./...
