name: Edge IPC Security

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/edge-security.yml"
      - "deploy/edge-ipc/**"
      - "integrations/privacy_ml/**"
      - "nodes/enterprise-node/**"
      - "policies/edge/**"
      - "workloads/llm-lora/**"
  pull_request:
    paths:
      - ".github/workflows/edge-security.yml"
      - "deploy/edge-ipc/**"
      - "integrations/privacy_ml/**"
      - "nodes/enterprise-node/**"
      - "policies/edge/**"
      - "workloads/llm-lora/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  ENTERPRISE_IMAGE: ghcr.io/${{ github.repository_owner }}/rapha-enterprise-node
  LORA_IMAGE: ghcr.io/${{ github.repository_owner }}/rapha-llm-lora

jobs:
  policy:
    name: OPA policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test Rego policies
        run: docker run --rm -v "${PWD}:/workspace" -w /workspace openpolicyagent/opa:0.70.0-static test policies/edge

  checkov:
    name: Checkov IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile,github_actions,secrets
          quiet: true
          skip_path: contracts/mainnet-bounty-deployment.json

  build-scan-sign:
    name: Build, scan, SBOM, sign
    runs-on: ubuntu-latest
    needs:
      - policy
      - checkov
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push enterprise node
        id: enterprise
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nodes/enterprise-node/Dockerfile.edge
          push: true
          tags: |
            ${{ env.ENTERPRISE_IMAGE }}:${{ github.sha }}
            ${{ env.ENTERPRISE_IMAGE }}:edge-latest

      - name: Build and push LoRA workload
        id: lora
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workloads/llm-lora/Dockerfile
          push: true
          tags: |
            ${{ env.LORA_IMAGE }}:${{ github.sha }}
            ${{ env.LORA_IMAGE }}:edge-latest

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Generate enterprise node Trivy report
        run: |
          mkdir -p trivy
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${PWD}/trivy:/trivy" aquasec/trivy:latest image --format json --output /trivy/enterprise-node-trivy.json "${ENTERPRISE_IMAGE}:${GITHUB_SHA}"

      - name: Generate LoRA workload Trivy report
        run: |
          mkdir -p trivy
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${PWD}/trivy:/trivy" aquasec/trivy:latest image --format json --output /trivy/llm-lora-trivy.json "${LORA_IMAGE}:${GITHUB_SHA}"

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapha-edge-trivy-reports
          path: trivy/*.json

      - name: Enforce enterprise node Trivy gate
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${PWD}:/workspace:ro" aquasec/trivy:latest image --ignorefile /workspace/.trivyignore --exit-code 1 --severity HIGH,CRITICAL "${ENTERPRISE_IMAGE}:${GITHUB_SHA}"

      - name: Enforce LoRA workload Trivy gate
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${PWD}:/workspace:ro" aquasec/trivy:latest image --ignorefile /workspace/.trivyignore --exit-code 1 --severity HIGH,CRITICAL "${LORA_IMAGE}:${GITHUB_SHA}"

      - name: Generate SBOMs
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${PWD}/sbom:/sbom" aquasec/trivy:latest image --format cyclonedx --output /sbom/enterprise-node.cdx.json "${ENTERPRISE_IMAGE}:${GITHUB_SHA}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${PWD}/sbom:/sbom" aquasec/trivy:latest image --format cyclonedx --output /sbom/llm-lora.cdx.json "${LORA_IMAGE}:${GITHUB_SHA}"

      - name: Sign images with Sigstore keyless
        run: |
          cosign sign --yes "${ENTERPRISE_IMAGE}@${{ steps.enterprise.outputs.digest }}"
          cosign sign --yes "${LORA_IMAGE}@${{ steps.lora.outputs.digest }}"

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: rapha-edge-sboms
          path: sbom/*.cdx.json
