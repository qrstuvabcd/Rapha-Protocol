name: Backend Oracle Security

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend-oracle-security.yml"
      - "backend-oracle/package.json"
      - "backend-oracle/package-lock.json"
      - "backend-oracle/src/**"
  pull_request:
    paths:
      - ".github/workflows/backend-oracle-security.yml"
      - "backend-oracle/package.json"
      - "backend-oracle/package-lock.json"
      - "backend-oracle/src/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-build-test:
    name: production audit, build, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-oracle
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend-oracle/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce production audit
        run: npm run audit:prod

      - name: Verify pinned vulnerable transitive dependencies
        run: npm ls protobufjs ws

      - name: Build backend oracle
        run: npm run build

      - name: Run backend tests
        run: npm test
